<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>peaceroom</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-primary: #0a0c10;
      --bg-secondary: #1a1e24;
      --bg-tertiary: #252b33;
      --bg-hover: #2f3640;
      --text-primary: #ffffff;
      --text-secondary: #b0b3b8;
      --text-muted: #8a8f99;
      --accent-blue: #0088cc;
      --accent-green: #25D366;
      --accent-purple: #6e5be2;
      --accent-red: #f15a5a;
      --border-color: #2f3540;
      --message-outgoing: #005e99;
      --message-incoming: #262d36;
      --online-indicator: #31a24c;
      --safe-area-top: env(safe-area-inset-top);
      --safe-area-bottom: env(safe-area-inset-bottom);
    }
    body {
      background: var(--bg-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      height: 100vh; height: 100dvh;
      overflow: hidden; position: fixed; width: 100%;
    }

    .login-screen {
      position: fixed; inset: 0; background: var(--bg-primary);
      display: flex; align-items: center; justify-content: center;
      z-index: 2000; padding: 20px;
    }
    .login-screen.hidden { display: none; }
    .login-box {
      width: 100%; max-width: 380px; background: var(--bg-secondary);
      border-radius: 28px; padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 {
      font-size: 42px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo p { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
    .input-group { margin-bottom: 14px; }
    .input-field {
      width: 100%; padding: 15px 16px; background: var(--bg-tertiary);
      border: 1px solid var(--border-color); border-radius: 14px;
      color: var(--text-primary); font-size: 16px; outline: none;
    }
    .input-field:focus { border-color: var(--accent-blue); }
    .btn {
      width: 100%; padding: 15px; border: none; border-radius: 14px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent-blue); color: white; margin-top: 8px; }
    .btn-primary:hover, .btn-primary:active { background: #006699; transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; pointer-events: none; }
    .status-text { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted); min-height: 20px; }

    .main-app { display: flex; width: 100%; height: 100%; background: var(--bg-secondary); }
    .main-app.hidden { display: none; }

    .sidebar {
      width: 280px; height: 100%; background: var(--bg-primary);
      display: flex; flex-direction: column; border-right: 1px solid var(--border-color);
    }
    @media (max-width: 700px) {
      .sidebar { width: 100%; position: absolute; z-index: 50; transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
    }
    .sidebar-header {
      padding: 18px 16px; padding-top: max(18px, var(--safe-area-top));
      border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px;
    }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px; flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-room { font-size: 12px; color: var(--text-muted); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--online-indicator); }
    .status-dot.offline { background: #9e9e9e; }

    .online-count {
      margin: 10px 12px; padding: 10px 14px; background: var(--bg-tertiary);
      border-radius: 12px; font-size: 13px; display: flex; align-items: center; gap: 8px;
    }
    .online-count i { color: var(--accent-green); }

    .users-list { flex: 1; overflow-y: auto; padding: 8px 10px; }
    .user-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 12px; margin-bottom: 4px; background: var(--bg-secondary);
    }
    .user-item .avatar-sm {
      width: 36px; height: 36px; border-radius: 50%; background: var(--bg-tertiary);
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
    }
    .user-item .name { font-size: 14px; font-weight: 500; }
    .user-item .role { font-size: 11px; color: var(--text-muted); }
    .host-badge {
      background: var(--accent-purple); color: white; font-size: 9px;
      padding: 2px 6px; border-radius: 8px; margin-left: 6px;
    }

    .chat-area { flex: 1; display: flex; flex-direction: column; height: 100%; }
    .chat-header {
      padding: 12px 16px; padding-top: max(12px, var(--safe-area-top));
      border-bottom: 1px solid var(--border-color); background: var(--bg-primary);
      display: flex; align-items: center; gap: 12px;
    }
    .menu-btn {
      width: 40px; height: 40px; border-radius: 50%; background: var(--bg-tertiary);
      border: none; color: var(--text-primary); font-size: 18px;
      display: none; align-items: center; justify-content: center; cursor: pointer;
    }
    @media (max-width: 700px) { .menu-btn { display: flex; } }
    .chat-title { flex: 1; }
    .chat-title h2 { font-size: 16px; font-weight: 600; }
    .chat-title p { font-size: 12px; color: var(--text-muted); }

    .messages-container {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .message-wrapper { display: flex; margin-bottom: 2px; animation: msgIn 0.2s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message-wrapper.own { justify-content: flex-end; }
    .message-wrapper.system { justify-content: center; }
    .message-bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 18px;
      background: var(--message-incoming); font-size: 14px; line-height: 1.4; word-wrap: break-word;
    }
    .message-wrapper.own .message-bubble {
      background: var(--message-outgoing); border-bottom-right-radius: 4px;
    }
    .message-wrapper:not(.own):not(.system) .message-bubble { border-bottom-left-radius: 4px; }
    .message-wrapper.system .message-bubble {
      background: transparent; color: var(--text-muted); font-size: 12px; padding: 4px 10px;
    }
    .msg-meta { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 2px; }
    .message-wrapper.own .msg-meta { text-align: right; }
    .message-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; text-align: right; }

    .input-area {
      padding: 12px 16px; padding-bottom: max(12px, var(--safe-area-bottom));
      background: var(--bg-primary); border-top: 1px solid var(--border-color);
      display: flex; gap: 10px; align-items: flex-end;
    }
    .input-wrapper { flex: 1; background: var(--bg-tertiary); border-radius: 22px; padding: 6px 16px; }
    .message-input {
      width: 100%; background: transparent; border: none; color: var(--text-primary);
      font-size: 15px; padding: 8px 0; outline: none; resize: none; max-height: 100px;
      font-family: inherit; line-height: 1.4;
    }
    .send-btn {
      width: 46px; height: 46px; border-radius: 50%; border: none;
      background: var(--accent-blue); color: white; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.45; pointer-events: none; }

    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--bg-tertiary); color: var(--text-primary); padding: 12px 22px;
      border-radius: 30px; font-size: 14px; z-index: 3000; display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4); max-width: 90%; text-align: center;
    }
  </style>
</head>
<body>

  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <div class="logo">
        <h1>peaceroom</h1>
        <p>Hybrid mesh • no backend</p>
      </div>
      <div class="input-group">
        <input type="text" id="nickInput" class="input-field" placeholder="Your nickname" maxlength="20" autocomplete="off">
      </div>
      <div class="input-group">
        <input type="text" id="roomInput" class="input-field" placeholder="Room name" value="peaceroom" maxlength="30" autocomplete="off">
      </div>
      <button id="joinBtn" class="btn btn-primary">
        <i class="fas fa-sign-in-alt"></i> Join Room
      </button>
      <div id="statusText" class="status-text"></div>
    </div>
  </div>

  <div id="mainApp" class="main-app hidden">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="avatar" id="myAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="myName">—</div>
          <div class="user-room" id="myRoom">—</div>
        </div>
        <div class="status-dot" id="connDot"></div>
      </div>
      <div class="online-count">
        <i class="fas fa-circle"></i>
        <span id="onlineCount">0</span> online
      </div>
      <div class="users-list" id="usersList"></div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        <div class="chat-title">
          <h2 id="roomTitle">peaceroom</h2>
          <p id="roomSub">connecting…</p>
        </div>
      </div>
      <div class="messages-container" id="messages"></div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="msgInput" class="message-input" placeholder="Type a message…" rows="1"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" disabled>
          <i class="fas fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===================== CONFIG =====================
    const STUN = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ];

    // ===================== STATE =====================
    let peer = null;
    let myId = '';
    let myNick = '';
    let roomName = '';
    let isHost = false;
    let hostId = null;                    // current host peer ID (usually = roomName)

    // Mesh
    const connections = new Map();        // peerId → DataConnection
    const online = new Map();             // peerId → nick

    // Prevent duplicate messages
    const seenMessages = new Set();

    // ===================== DOM =====================
    const loginScreen = document.getElementById('loginScreen');
    const mainApp = document.getElementById('mainApp');
    const nickInput = document.getElementById('nickInput');
    const roomInput = document.getElementById('roomInput');
    const joinBtn = document.getElementById('joinBtn');
    const statusText = document.getElementById('statusText');
    const myAvatar = document.getElementById('myAvatar');
    const myName = document.getElementById('myName');
    const myRoom = document.getElementById('myRoom');
    const connDot = document.getElementById('connDot');
    const onlineCount = document.getElementById('onlineCount');
    const usersList = document.getElementById('usersList');
    const roomTitle = document.getElementById('roomTitle');
    const roomSub = document.getElementById('roomSub');
    const messages = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const toast = document.getElementById('toast');

    // ===================== HELPERS =====================
    function showToast(msg, ms = 2200) {
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', ms);
    }

    function systemMsg(text) {
      const div = document.createElement('div');
      div.className = 'message-wrapper system';
      div.innerHTML = `<div class="message-bubble">${text}</div>`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addChatMsg(from, nick, text, isOwn) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const div = document.createElement('div');
      div.className = `message-wrapper ${isOwn ? 'own' : ''}`;
      div.innerHTML = `
        <div class="message-bubble">
          ${!isOwn ? `<div class="msg-meta">${escapeHtml(nick)}</div>` : ''}
          ${escapeHtml(text)}
          <div class="message-time">${time}</div>
        </div>`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function updateUsersUI() {
      onlineCount.textContent = online.size;
      usersList.innerHTML = '';

      // Self first
      const self = document.createElement('div');
      self.className = 'user-item';
      self.innerHTML = `
        <div class="avatar-sm">${myNick.charAt(0).toUpperCase()}</div>
        <div>
          <div class="name">${escapeHtml(myNick)} <span style="color:var(--text-muted);font-size:11px">(you)</span>
            ${isHost ? '<span class="host-badge">HOST</span>' : ''}
          </div>
        </div>`;
      usersList.appendChild(self);

      online.forEach((nick, id) => {
        if (id === myId) return;
        const el = document.createElement('div');
        el.className = 'user-item';
        const isCurrentHost = id === hostId;
        el.innerHTML = `
          <div class="avatar-sm">${nick.charAt(0).toUpperCase()}</div>
          <div>
            <div class="name">${escapeHtml(nick)}
              ${isCurrentHost ? '<span class="host-badge">HOST</span>' : ''}
            </div>
            <div class="role">${id.substring(0, 8)}…</div>
          </div>`;
        usersList.appendChild(el);
      });
    }

    function setConnected(connected) {
      if (connected) {
        connDot.classList.remove('offline');
        sendBtn.disabled = false;
      } else {
        connDot.classList.add('offline');
        // keep send enabled if we still have mesh peers
        sendBtn.disabled = connections.size === 0 && !isHost;
      }
    }

    // ===================== MESH CONNECTION =====================
    function setupDataConnection(conn, remoteNick = null) {
      const peerId = conn.peer;

      // Already have this connection?
      if (connections.has(peerId) && connections.get(peerId).open) {
        return;
      }

      connections.set(peerId, conn);

      conn.on('open', () => {
        // Exchange nick if we don't know it yet
        if (!online.has(peerId)) {
          conn.send(JSON.stringify({ type: 'nick', nick: myNick }));
        }
        if (remoteNick) {
          online.set(peerId, remoteNick);
          updateUsersUI();
        }
        setConnected(true);
      });

      conn.on('data', raw => {
        let msg;
        try { msg = JSON.parse(raw); } catch { return; }
        handleMessage(msg, peerId);
      });

      conn.on('close', () => {
        connections.delete(peerId);
        if (online.has(peerId)) {
          const nick = online.get(peerId);
          online.delete(peerId);
          updateUsersUI();
          systemMsg(`${nick} left`);
        }
        // If this was the host
        if (peerId === hostId) {
          hostId = null;
          roomSub.textContent = 'host left – mesh still active';
          systemMsg('Host left. You can still chat with remaining people.');
          showToast('Host left – room stays open');
        }
        setConnected(connections.size > 0 || isHost);
      });

      conn.on('error', err => {
        console.warn('DataConnection error', peerId, err);
      });
    }

    function connectToPeer(remoteId, remoteNick = null) {
      if (remoteId === myId) return;
      if (connections.has(remoteId) && connections.get(remoteId).open) return;

      try {
        const conn = peer.connect(remoteId, { reliable: true });
        setupDataConnection(conn, remoteNick);
      } catch (e) {
        console.warn('Failed to connect to', remoteId, e);
      }
    }

    // ===================== MESSAGE HANDLING =====================
    function handleMessage(msg, fromId) {
      switch (msg.type) {
        case 'nick':
          online.set(fromId, msg.nick);
          updateUsersUI();
          break;

        case 'welcome':
          // Host sent us the full list
          hostId = msg.hostId || roomName;
          online.clear();
          online.set(myId, myNick);
          (msg.users || []).forEach(u => {
            if (u.id !== myId) {
              online.set(u.id, u.nick);
              connectToPeer(u.id, u.nick);   // form mesh
            }
          });
          updateUsersUI();
          roomSub.textContent = 'connected (mesh)';
          setConnected(true);
          break;

        case 'user-joined':
          if (msg.id === myId) return;
          online.set(msg.id, msg.nick);
          updateUsersUI();
          connectToPeer(msg.id, msg.nick);   // form mesh
          systemMsg(`${msg.nick} joined`);
          break;

        case 'user-left':
          if (online.has(msg.id)) {
            online.delete(msg.id);
            connections.delete(msg.id);
            updateUsersUI();
            systemMsg(`${msg.nick} left`);
          }
          break;

        case 'chat':
          // Deduplicate
          if (msg.msgId && seenMessages.has(msg.msgId)) return;
          if (msg.msgId) {
            seenMessages.add(msg.msgId);
            // keep set from growing forever
            if (seenMessages.size > 300) {
              const first = seenMessages.values().next().value;
              seenMessages.delete(first);
            }
          }
          if (msg.from === myId) return; // already shown locally
          addChatMsg(msg.from, msg.nick, msg.text, false);
          break;
      }
    }

    // Broadcast to the whole mesh
    function meshBroadcast(obj) {
      const data = JSON.stringify(obj);
      connections.forEach(conn => {
        if (conn.open) {
          try { conn.send(data); } catch (e) {}
        }
      });
    }

    // ===================== HOST LOGIC =====================
    function becomeHost() {
      isHost = true;
      myId = roomName;
      hostId = roomName;
      online.set(myId, myNick);
      updateUsersUI();
      roomSub.textContent = 'you are the host (mesh ready)';
      setConnected(true);
      systemMsg('Room created. Waiting for others…');
      showToast('You are the host');
    }

    function hostHandleIncoming(conn) {
      // This is a new peer connecting to the room ID
      conn.on('open', () => {
        // wait for hello
      });

      conn.on('data', raw => {
        let msg;
        try { msg = JSON.parse(raw); } catch { return; }

        if (msg.type === 'hello') {
          const newId = conn.peer;
          const newNick = msg.nick || 'Anon';

          // Add to our mesh view
          online.set(newId, newNick);
          setupDataConnection(conn, newNick);   // host also keeps direct connection
          updateUsersUI();

          // 1. Send full list to the newcomer
          const users = Array.from(online.entries()).map(([id, nick]) => ({ id, nick }));
          conn.send(JSON.stringify({
            type: 'welcome',
            hostId: myId,
            users
          }));

          // 2. Tell everyone else about the new peer
          meshBroadcast({
            type: 'user-joined',
            id: newId,
            nick: newNick
          });

          systemMsg(`${newNick} joined`);
        }
      });

      conn.on('close', () => {
        const peerId = conn.peer;
        if (online.has(peerId)) {
          const nick = online.get(peerId);
          online.delete(peerId);
          connections.delete(peerId);
          updateUsersUI();
          meshBroadcast({ type: 'user-left', id: peerId, nick });
          systemMsg(`${nick} left`);
        }
      });
    }

    // ===================== CLIENT JOIN =====================
    function joinAsClient() {
      isHost = false;
      const conn = peer.connect(roomName, { reliable: true });

      // Temporary connection just to get the welcome + introductions
      conn.on('open', () => {
        conn.send(JSON.stringify({ type: 'hello', nick: myNick }));
      });

      conn.on('data', raw => {
        let msg;
        try { msg = JSON.parse(raw); } catch { return; }
        handleMessage(msg, conn.peer);
      });

      conn.on('close', () => {
        // Host may have left – mesh should already be formed
        if (hostId === roomName) {
          hostId = null;
          roomSub.textContent = 'host left – mesh still active';
        }
      });

      conn.on('error', err => {
        console.error(err);
        statusText.textContent = 'Could not reach host. Try creating the room yourself.';
        joinBtn.disabled = false;
      });

      // Also treat this connection as part of the mesh
      setupDataConnection(conn);
    }

    // ===================== START =====================
    function start() {
      myNick = nickInput.value.trim() || 'Anon';
      roomName = (roomInput.value.trim() || 'peaceroom').toLowerCase().replace(/[^a-z0-9-_]/g, '');
      if (!roomName) roomName = 'peaceroom';

      joinBtn.disabled = true;
      statusText.textContent = 'Connecting…';

      // Try to become host first
      peer = new Peer(roomName, {
        config: { iceServers: STUN },
        debug: 1
      });

      peer.on('open', id => {
        // We successfully claimed the room ID
        becomeHost();
        finishLogin();
      });

      peer.on('connection', conn => {
        if (isHost) hostHandleIncoming(conn);
      });

      peer.on('error', err => {
        if (err.type === 'unavailable-id') {
          // Room already exists → join as normal peer
          peer.destroy();

          peer = new Peer({
            config: { iceServers: STUN },
            debug: 1
          });

          peer.on('open', id => {
            myId = id;
            online.set(myId, myNick);
            updateUsersUI();
            joinAsClient();
            finishLogin();
          });

          peer.on('connection', conn => {
            // Incoming mesh connection from another peer
            setupDataConnection(conn);
          });

          peer.on('error', e => {
            console.error(e);
            statusText.textContent = 'Peer error: ' + e.type;
            joinBtn.disabled = false;
          });
        } else {
          console.error(err);
          statusText.textContent = 'Error: ' + err.type;
          joinBtn.disabled = false;
        }
      });
    }

    function finishLogin() {
      loginScreen.classList.add('hidden');
      mainApp.classList.remove('hidden');
      myAvatar.textContent = myNick.charAt(0).toUpperCase();
      myName.textContent = myNick;
      myRoom.textContent = '#' + roomName;
      roomTitle.textContent = roomName;
    }

    // ===================== SEND CHAT =====================
    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      const msgId = myId + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
      const payload = {
        type: 'chat',
        from: myId,
        nick: myNick,
        text,
        msgId
      };

      // Show locally immediately
      addChatMsg(myId, myNick, text, true);
      seenMessages.add(msgId);

      // Send to entire mesh
      meshBroadcast(payload);

      msgInput.value = '';
      msgInput.style.height = 'auto';
    }

    // ===================== EVENTS =====================
    joinBtn.addEventListener('click', start);
    nickInput.addEventListener('keypress', e => { if (e.key === 'Enter') start(); });
    roomInput.addEventListener('keypress', e => { if (e.key === 'Enter') start(); });

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    msgInput.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
    document.addEventListener('click', e => {
      if (window.innerWidth <= 700 && sidebar.classList.contains('open') &&
          !sidebar.contains(e.target) && e.target !== menuBtn) {
        sidebar.classList.remove('open');
      }
    });

    nickInput.focus();
  </script>
</body>
</html>
