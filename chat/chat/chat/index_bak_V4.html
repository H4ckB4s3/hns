<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>peaceroom</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-primary: #0a0c10;
      --bg-secondary: #1a1e24;
      --bg-tertiary: #252b33;
      --bg-hover: #2f3640;
      --text-primary: #ffffff;
      --text-muted: #8a8f99;
      --accent-blue: #0088cc;
      --accent-purple: #6e5be2;
      --accent-green: #25D366;
      --accent-red: #f15a5a;
      --accent-orange: #f39c12;
      --border-color: #2f3540;
      --message-outgoing: #005e99;
      --message-incoming: #262d36;
      --online-indicator: #31a24c;
      --safe-area-top: env(safe-area-inset-top);
      --safe-area-bottom: env(safe-area-inset-bottom);
    }
    body {
      background: var(--bg-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      height: 100vh; height: 100dvh;
      overflow: hidden; position: fixed; width: 100%;
    }

    /* LOGIN */
    .login-screen {
      position: fixed; inset: 0; background: var(--bg-primary);
      display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px;
    }
    .login-screen.hidden { display: none; }
    .login-box {
      width: 100%; max-width: 380px; background: var(--bg-secondary);
      border-radius: 28px; padding: 32px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 {
      font-size: 42px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo p { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
    .input-group { margin-bottom: 14px; }
    .input-field {
      width: 100%; padding: 15px 16px; background: var(--bg-tertiary);
      border: 1px solid var(--border-color); border-radius: 14px;
      color: var(--text-primary); font-size: 16px; outline: none;
    }
    .input-field:focus { border-color: var(--accent-blue); }
    .btn {
      width: 100%; padding: 15px; border: none; border-radius: 14px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary { background: var(--accent-blue); color: white; margin-top: 8px; }
    .btn-primary:disabled { opacity: 0.5; pointer-events: none; }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); margin-top: 8px; }
    .btn-danger { background: var(--accent-red); color: white; }
    .btn-success { background: var(--accent-green); color: white; }
    .status-text { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted); min-height: 20px; }

    /* MAIN */
    .main-app { display: flex; width: 100%; height: 100%; background: var(--bg-secondary); }
    .main-app.hidden { display: none; }

    .sidebar {
      width: 280px; height: 100%; background: var(--bg-primary);
      display: flex; flex-direction: column; border-right: 1px solid var(--border-color);
    }
    @media (max-width: 900px) {
      .sidebar { width: 100%; position: absolute; z-index: 50; transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
    }
    .sidebar-header {
      padding: 16px; padding-top: max(16px, var(--safe-area-top));
      border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px;
    }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 600; font-size: 15px; }
    .user-room { font-size: 12px; color: var(--text-muted); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--online-indicator); }
    .status-dot.offline { background: #9e9e9e; }

    .online-count {
      margin: 10px 12px; padding: 10px 14px; background: var(--bg-tertiary);
      border-radius: 12px; font-size: 13px; display: flex; align-items: center; gap: 8px;
    }
    .online-count i { color: var(--accent-green); }

    .users-list { flex: 1; overflow-y: auto; padding: 8px 10px; }
    .user-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 12px; margin-bottom: 4px; background: var(--bg-secondary);
    }
    .user-item .avatar-sm {
      width: 36px; height: 36px; border-radius: 50%; background: var(--bg-tertiary);
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
    }
    .user-item .info { flex: 1; min-width: 0; }
    .user-item .name { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .host-badge {
      background: var(--accent-purple); color: white; font-size: 9px;
      padding: 2px 6px; border-radius: 8px;
    }
    .private-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: var(--bg-tertiary); color: var(--text-muted); cursor: pointer; font-size: 13px;
    }
    .private-btn:hover { background: var(--accent-blue); color: white; }

    /* CHAT + VIDEO AREA */
    .center-area { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }

    .chat-header {
      padding: 12px 16px; padding-top: max(12px, var(--safe-area-top));
      border-bottom: 1px solid var(--border-color); background: var(--bg-primary);
      display: flex; align-items: center; gap: 12px;
    }
    .menu-btn {
      width: 40px; height: 40px; border-radius: 50%; background: var(--bg-tertiary);
      border: none; color: var(--text-primary); font-size: 18px;
      display: none; align-items: center; justify-content: center; cursor: pointer;
    }
    @media (max-width: 900px) { .menu-btn { display: flex; } }
    .chat-title { flex: 1; }
    .chat-title h2 { font-size: 16px; font-weight: 600; }
    .chat-title p { font-size: 12px; color: var(--text-muted); }

    /* VIDEO GRID */
    .video-section {
      display: none; background: #000; padding: 8px;
      max-height: 45%; overflow-y: auto; border-bottom: 1px solid var(--border-color);
    }
    .video-section.active { display: block; }
    .video-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px;
    }
    .video-tile {
      position: relative; background: #1a1a1a; border-radius: 12px; overflow: hidden;
      aspect-ratio: 16/10;
    }
    .video-tile video { width: 100%; height: 100%; object-fit: cover; }
    .video-tile .label {
      position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.65);
      color: white; padding: 3px 10px; border-radius: 12px; font-size: 12px;
    }
    .video-tile.screen-share {
      grid-column: 1 / -1; aspect-ratio: 16/9; max-height: 360px;
    }

    .messages-container {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .message-wrapper { display: flex; margin-bottom: 2px; }
    .message-wrapper.own { justify-content: flex-end; }
    .message-wrapper.system { justify-content: center; }
    .message-bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 18px;
      background: var(--message-incoming); font-size: 14px; line-height: 1.4; word-wrap: break-word;
    }
    .message-wrapper.own .message-bubble {
      background: var(--message-outgoing); border-bottom-right-radius: 4px;
    }
    .message-wrapper:not(.own):not(.system) .message-bubble { border-bottom-left-radius: 4px; }
    .message-wrapper.system .message-bubble {
      background: transparent; color: var(--text-muted); font-size: 12px; padding: 4px 10px;
    }
    .msg-meta { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 2px; }
    .message-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; text-align: right; }
    .msg-file {
      display: flex; align-items: center; gap: 10px; padding: 8px;
      background: rgba(255,255,255,0.08); border-radius: 12px; cursor: pointer;
    }
    .msg-file img { max-width: 180px; max-height: 140px; border-radius: 8px; }

    /* INPUT */
    .input-area {
      padding: 10px 14px; padding-bottom: max(10px, var(--safe-area-bottom));
      background: var(--bg-primary); border-top: 1px solid var(--border-color);
      display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;
    }
    .input-tools { display: flex; gap: 6px; }
    .tool-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: var(--bg-tertiary); color: var(--text-muted); cursor: pointer; font-size: 16px;
    }
    .tool-btn:hover, .tool-btn.active { background: var(--accent-blue); color: white; }
    .tool-btn.danger { background: var(--accent-red); color: white; }
    .input-wrapper { flex: 1; background: var(--bg-tertiary); border-radius: 22px; padding: 6px 14px; min-width: 120px; }
    .message-input {
      width: 100%; background: transparent; border: none; color: var(--text-primary);
      font-size: 15px; padding: 8px 0; outline: none; resize: none; max-height: 90px;
      font-family: inherit; line-height: 1.4;
    }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--accent-blue); color: white; font-size: 17px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .send-btn:disabled { opacity: 0.45; pointer-events: none; }

    /* EMOJI PICKER */
    .emoji-picker {
      display: none; position: absolute; bottom: 70px; left: 14px;
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 12px; width: 280px; max-height: 200px;
      overflow-y: auto; z-index: 100; display: none; flex-wrap: wrap; gap: 6px;
    }
    .emoji-picker.show { display: flex; }
    .emoji-picker span {
      font-size: 22px; cursor: pointer; padding: 4px; border-radius: 8px;
    }
    .emoji-picker span:hover { background: var(--bg-hover); }

    /* MEDIA CONTROLS BAR */
    .media-bar {
      display: none; justify-content: center; gap: 12px; padding: 10px;
      background: rgba(0,0,0,0.85); border-top: 1px solid var(--border-color);
    }
    .media-bar.active { display: flex; }
    .media-btn {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: var(--bg-tertiary); color: white; font-size: 18px; cursor: pointer;
    }
    .media-btn.off { background: var(--accent-red); }
    .media-btn.screen { background: var(--accent-orange); }

    /* PRIVATE CHAT MODAL */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1500; display: none;
    }
    .modal-backdrop.active { display: block; }
    .modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; max-width: 420px; max-height: 80vh; background: var(--bg-secondary);
      border-radius: 24px; padding: 24px; z-index: 1600; display: none; flex-direction: column;
    }
    .modal.active { display: flex; }
    .modal h3 { margin-bottom: 16px; }
    .private-messages {
      flex: 1; overflow-y: auto; min-height: 200px; max-height: 40vh;
      background: var(--bg-primary); border-radius: 12px; padding: 12px; margin-bottom: 12px;
    }
    .private-input-row { display: flex; gap: 8px; }
    .private-input-row input {
      flex: 1; padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border-color);
      border-radius: 12px; color: white; outline: none;
    }

    /* PRIVATE REQUEST BANNER */
    .private-request {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: var(--bg-secondary); border: 1px solid var(--accent-blue);
      border-radius: 16px; padding: 16px 20px; z-index: 1800; display: none;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5); max-width: 90%;
    }
    .private-request.active { display: block; }
    .private-request .actions { display: flex; gap: 10px; margin-top: 12px; }

    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--bg-tertiary); color: var(--text-primary); padding: 12px 22px;
      border-radius: 30px; font-size: 14px; z-index: 3000; display: none; max-width: 90%; text-align: center;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <div class="logo">
        <h1>peaceroom</h1>
        <p>Hybrid mesh • max 13 users</p>
      </div>
      <div class="input-group">
        <input type="text" id="nickInput" class="input-field" placeholder="Your nickname" maxlength="20" autocomplete="off">
      </div>
      <div class="input-group">
        <input type="text" id="roomInput" class="input-field" placeholder="Room name" value="peaceroom" maxlength="30" autocomplete="off">
      </div>
      <button id="joinBtn" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Join Room</button>
      <div id="statusText" class="status-text"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainApp" class="main-app hidden">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="avatar" id="myAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="myName">—</div>
          <div class="user-room" id="myRoom">—</div>
        </div>
        <div class="status-dot" id="connDot"></div>
      </div>
      <div class="online-count">
        <i class="fas fa-circle"></i>
        <span id="onlineCount">0</span> / 13 online
      </div>
      <div class="users-list" id="usersList"></div>
    </div>

    <div class="center-area">
      <div class="chat-header">
        <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        <div class="chat-title">
          <h2 id="roomTitle">peaceroom</h2>
          <p id="roomSub">connecting…</p>
        </div>
      </div>

      <!-- VIDEO SECTION -->
      <div class="video-section" id="videoSection">
        <div class="video-grid" id="videoGrid"></div>
      </div>

      <div class="messages-container" id="messages"></div>

      <!-- Emoji picker -->
      <div class="emoji-picker" id="emojiPicker"></div>

      <div class="input-area">
        <div class="input-tools">
          <button class="tool-btn" id="emojiBtn" title="Emoji"><i class="fas fa-smile"></i></button>
          <button class="tool-btn" id="fileBtn" title="File / Image"><i class="fas fa-paperclip"></i></button>
          <button class="tool-btn" id="camBtn" title="Camera"><i class="fas fa-video"></i></button>
          <button class="tool-btn" id="micBtn" title="Microphone"><i class="fas fa-microphone"></i></button>
          <button class="tool-btn" id="screenBtn" title="Share screen (host)" style="display:none"><i class="fas fa-desktop"></i></button>
        </div>
        <div class="input-wrapper">
          <textarea id="msgInput" class="message-input" placeholder="Type a message…" rows="1"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" disabled><i class="fas fa-arrow-up"></i></button>
      </div>

      <div class="media-bar" id="mediaBar">
        <button class="media-btn" id="toggleMicMedia"><i class="fas fa-microphone"></i></button>
        <button class="media-btn" id="toggleCamMedia"><i class="fas fa-video"></i></button>
        <button class="media-btn screen" id="toggleScreenMedia" style="display:none"><i class="fas fa-desktop"></i></button>
        <button class="media-btn off" id="stopMediaBtn"><i class="fas fa-phone-slash"></i></button>
      </div>
    </div>
  </div>

  <!-- PRIVATE REQUEST -->
  <div class="private-request" id="privateRequest">
    <div id="privateRequestText">User wants a private chat</div>
    <div class="actions">
      <button class="btn btn-success" id="acceptPrivate" style="width:auto;padding:10px 18px">Accept</button>
      <button class="btn btn-danger" id="declinePrivate" style="width:auto;padding:10px 18px">Decline</button>
    </div>
  </div>

  <!-- PRIVATE CHAT MODAL -->
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="privateModal">
    <h3 id="privateTitle">Private chat</h3>
    <div class="private-messages" id="privateMessages"></div>
    <div class="private-input-row">
      <input type="text" id="privateInput" placeholder="Private message…">
      <button class="btn btn-primary" id="privateSend" style="width:auto;padding:10px 16px">Send</button>
    </div>
    <button class="btn btn-secondary" id="closePrivate" style="margin-top:12px">Close</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const MAX_USERS = 13;
    const STUN = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ];
    const EMOJIS = ['😀','😂','🤣','😊','😍','🥰','😘','😜','🤔','😎','😭','😡','👍','👎','❤️','🔥','✨','🎉','🙏','💯','👀','💬','🚀','✅','❌','⭐','🌈','🍕','☕','🎵'];

    let peer = null, myId = '', myNick = '', roomName = '', isHost = false, hostId = null;
    const connections = new Map();
    const online = new Map();
    const seenMessages = new Set();
    const mediaCalls = new Map();          // peerId → MediaConnection
    const remoteStreams = new Map();       // peerId → MediaStream
    let localStream = null;
    let screenStream = null;
    let camEnabled = false, micEnabled = false, screenSharing = false;

    // Private chat
    let privateWith = null;                // peerId currently in private
    let pendingPrivateFrom = null;
    const privateMessages = new Map();     // peerId → [{from,text,time}]

    // File transfer
    const fileTransfers = new Map();

    // DOM
    const $ = id => document.getElementById(id);
    const loginScreen = $('loginScreen'), mainApp = $('mainApp');
    const nickInput = $('nickInput'), roomInput = $('roomInput'), joinBtn = $('joinBtn'), statusText = $('statusText');
    const myAvatar = $('myAvatar'), myName = $('myName'), myRoom = $('myRoom'), connDot = $('connDot');
    const onlineCount = $('onlineCount'), usersList = $('usersList');
    const roomTitle = $('roomTitle'), roomSub = $('roomSub'), messages = $('messages');
    const msgInput = $('msgInput'), sendBtn = $('sendBtn'), menuBtn = $('menuBtn'), sidebar = $('sidebar');
    const emojiBtn = $('emojiBtn'), emojiPicker = $('emojiPicker'), fileBtn = $('fileBtn');
    const camBtn = $('camBtn'), micBtn = $('micBtn'), screenBtn = $('screenBtn');
    const videoSection = $('videoSection'), videoGrid = $('videoGrid'), mediaBar = $('mediaBar');
    const toast = $('toast');

    function showToast(msg, ms = 2500) {
      toast.textContent = msg; toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', ms);
    }
    function systemMsg(text) {
      const div = document.createElement('div');
      div.className = 'message-wrapper system';
      div.innerHTML = `<div class="message-bubble">${text}</div>`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function addChatMsg(from, nick, text, isOwn, extraHtml = '') {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const div = document.createElement('div');
      div.className = `message-wrapper ${isOwn ? 'own' : ''}`;
      div.innerHTML = `
        <div class="message-bubble">
          ${!isOwn ? `<div class="msg-meta">${escapeHtml(nick)}</div>` : ''}
          ${extraHtml || escapeHtml(text)}
          <div class="message-time">${time}</div>
        </div>`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function updateUsersUI() {
      onlineCount.textContent = online.size;
      usersList.innerHTML = '';
      const self = document.createElement('div');
      self.className = 'user-item';
      self.innerHTML = `
        <div class="avatar-sm">${myNick.charAt(0).toUpperCase()}</div>
        <div class="info"><div class="name">${escapeHtml(myNick)} <span style="color:var(--text-muted);font-size:11px">(you)</span>
          ${isHost ? '<span class="host-badge">HOST</span>' : ''}</div></div>`;
      usersList.appendChild(self);

      online.forEach((nick, id) => {
        if (id === myId) return;
        const el = document.createElement('div');
        el.className = 'user-item';
        el.innerHTML = `
          <div class="avatar-sm">${nick.charAt(0).toUpperCase()}</div>
          <div class="info">
            <div class="name">${escapeHtml(nick)} ${id === hostId ? '<span class="host-badge">HOST</span>' : ''}</div>
          </div>
          <button class="private-btn" title="Request private chat" data-id="${id}" data-nick="${escapeHtml(nick)}">
            <i class="fas fa-user-lock"></i>
          </button>`;
        usersList.appendChild(el);
      });

      // bind private buttons
      usersList.querySelectorAll('.private-btn').forEach(btn => {
        btn.onclick = () => requestPrivate(btn.dataset.id, btn.dataset.nick);
      });

      // show screen button only for host
      screenBtn.style.display = isHost ? 'inline-flex' : 'none';
      $('toggleScreenMedia').style.display = isHost ? 'inline-flex' : 'none';
    }

    function setConnected(ok) {
      connDot.classList.toggle('offline', !ok);
      sendBtn.disabled = !ok && connections.size === 0 && !isHost;
    }

    // ========== DATA MESH ==========
    function setupDataConnection(conn, remoteNick = null) {
      const peerId = conn.peer;
      if (connections.has(peerId) && connections.get(peerId).open) return;
      connections.set(peerId, conn);

      conn.on('open', () => {
        try { conn.send(JSON.stringify({ type: 'nick', nick: myNick })); } catch(e){}
        if (remoteNick) { online.set(peerId, remoteNick); updateUsersUI(); }
        setConnected(true);
      });
      conn.on('data', raw => {
        let msg; try { msg = JSON.parse(raw); } catch { return; }
        handleMessage(msg, peerId);
      });
      conn.on('close', () => {
        connections.delete(peerId);
        if (online.has(peerId)) {
          const nick = online.get(peerId);
          online.delete(peerId);
          updateUsersUI();
          systemMsg(`${nick} left`);
          cleanupMediaFor(peerId);
        }
        if (peerId === hostId) {
          hostId = null;
          roomSub.textContent = 'host left – mesh still active';
          systemMsg('Host left. You can still chat.');
        }
        setConnected(connections.size > 0 || isHost);
      });
    }

    function connectToPeer(remoteId, remoteNick = null) {
      if (!remoteId || remoteId === myId) return;
      if (connections.has(remoteId) && connections.get(remoteId).open) return;
      try {
        const conn = peer.connect(remoteId, { reliable: true });
        setupDataConnection(conn, remoteNick);
      } catch(e){}
    }

    function flood(msg, exceptId = null) {
      const data = JSON.stringify(msg);
      connections.forEach((conn, id) => {
        if (id !== exceptId && conn.open) try { conn.send(data); } catch(e){}
      });
    }

    function handleMessage(msg, fromId) {
      switch (msg.type) {
        case 'nick':
          if (msg.nick) { online.set(fromId, msg.nick); updateUsersUI(); }
          break;
        case 'welcome':
          hostId = msg.hostId || roomName;
          online.clear(); online.set(myId, myNick);
          (msg.users || []).forEach(u => {
            if (u.id !== myId) { online.set(u.id, u.nick); connectToPeer(u.id, u.nick); }
          });
          updateUsersUI(); roomSub.textContent = 'connected (mesh)'; setConnected(true);
          break;
        case 'user-joined':
          if (msg.id === myId) return;
          online.set(msg.id, msg.nick); updateUsersUI();
          connectToPeer(msg.id, msg.nick);
          systemMsg(`${msg.nick} joined`);
          // if we have media, call the new peer
          if (localStream) callPeer(msg.id);
          break;
        case 'user-left':
          if (online.has(msg.id)) {
            online.delete(msg.id); connections.delete(msg.id);
            updateUsersUI(); systemMsg(`${msg.nick} left`);
            cleanupMediaFor(msg.id);
          }
          break;
        case 'room-full':
          showToast('Room is full (max 13 users)');
          statusText.textContent = 'Room is full';
          break;
        case 'chat':
          if (msg.msgId && seenMessages.has(msg.msgId)) return;
          if (msg.msgId) { seenMessages.add(msg.msgId); if (seenMessages.size > 500) seenMessages.delete(seenMessages.values().next().value); }
          if (msg.from !== myId) addChatMsg(msg.from, msg.nick, msg.text, false);
          flood(msg, fromId);
          break;
        case 'file-info':
          handleFileInfo(fromId, msg); flood(msg, fromId); break;
        case 'file-chunk':
          handleFileChunk(fromId, msg); flood(msg, fromId); break;
        case 'private-request':
          if (privateWith) return; // already in one
          pendingPrivateFrom = fromId;
          $('privateRequestText').textContent = `${msg.nick} wants a private chat with you`;
          $('privateRequest').classList.add('active');
          break;
        case 'private-accept':
          privateWith = fromId;
          openPrivateModal(online.get(fromId) || fromId);
          showToast('Private chat started');
          break;
        case 'private-decline':
          showToast('Private chat declined');
          break;
        case 'private-chat':
          if (!privateMessages.has(fromId)) privateMessages.set(fromId, []);
          privateMessages.get(fromId).push({ from: fromId, nick: msg.nick, text: msg.text, time: Date.now() });
          if (privateWith === fromId) renderPrivateMessages();
          else showToast(`Private message from ${msg.nick}`);
          break;
      }
    }

    // ========== HOST ==========
    function becomeHost() {
      isHost = true; myId = roomName; hostId = roomName;
      online.set(myId, myNick); updateUsersUI();
      roomSub.textContent = 'you are the host'; setConnected(true);
      systemMsg('Room created (max 13 users)'); showToast('You are the host');
    }

    function hostHandleIncoming(conn) {
      conn.on('data', raw => {
        let msg; try { msg = JSON.parse(raw); } catch { return; }
        if (msg.type === 'hello') {
          if (online.size >= MAX_USERS) {
            try { conn.send(JSON.stringify({ type: 'room-full' })); } catch(e){}
            conn.close(); return;
          }
          const newId = conn.peer, newNick = msg.nick || 'Anon';
          online.set(newId, newNick);
          setupDataConnection(conn, newNick); updateUsersUI();
          const users = Array.from(online.entries()).map(([id, nick]) => ({ id, nick }));
          try { conn.send(JSON.stringify({ type: 'welcome', hostId: myId, users })); } catch(e){}
          flood({ type: 'user-joined', id: newId, nick: newNick }, newId);
          systemMsg(`${newNick} joined`);
          if (localStream) callPeer(newId);
        } else handleMessage(msg, conn.peer);
      });
      conn.on('close', () => {
        const peerId = conn.peer;
        if (online.has(peerId)) {
          const nick = online.get(peerId);
          online.delete(peerId); connections.delete(peerId);
          updateUsersUI(); flood({ type: 'user-left', id: peerId, nick });
          systemMsg(`${nick} left`); cleanupMediaFor(peerId);
        }
      });
    }

    function joinAsClient() {
      isHost = false;
      const conn = peer.connect(roomName, { reliable: true });
      conn.on('open', () => { try { conn.send(JSON.stringify({ type: 'hello', nick: myNick })); } catch(e){} });
      setupDataConnection(conn);
      conn.on('error', () => { statusText.textContent = 'Could not reach host'; joinBtn.disabled = false; });
    }

    // ========== START ==========
    function start() {
      myNick = nickInput.value.trim() || 'Anon';
      roomName = (roomInput.value.trim() || 'peaceroom').toLowerCase().replace(/[^a-z0-9-_]/g, '') || 'peaceroom';
      joinBtn.disabled = true; statusText.textContent = 'Connecting…';

      peer = new Peer(roomName, { config: { iceServers: STUN }, debug: 1 });
      peer.on('open', () => { becomeHost(); finishLogin(); });
      peer.on('connection', conn => { if (isHost) hostHandleIncoming(conn); else setupDataConnection(conn); });
      peer.on('call', handleIncomingCall);
      peer.on('error', err => {
        if (err.type === 'unavailable-id') {
          peer.destroy();
          peer = new Peer({ config: { iceServers: STUN }, debug: 1 });
          peer.on('open', id => { myId = id; online.set(myId, myNick); updateUsersUI(); joinAsClient(); finishLogin(); });
          peer.on('connection', conn => setupDataConnection(conn));
          peer.on('call', handleIncomingCall);
          peer.on('error', e => { statusText.textContent = 'Error: ' + e.type; joinBtn.disabled = false; });
        } else { statusText.textContent = 'Error: ' + err.type; joinBtn.disabled = false; }
      });
    }

    function finishLogin() {
      loginScreen.classList.add('hidden'); mainApp.classList.remove('hidden');
      myAvatar.textContent = myNick.charAt(0).toUpperCase();
      myName.textContent = myNick; myRoom.textContent = '#' + roomName; roomTitle.textContent = roomName;
    }

    // ========== CHAT SEND ==========
    function sendMessage() {
      const text = msgInput.value.trim(); if (!text) return;
      const msgId = myId + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      const payload = { type: 'chat', from: myId, nick: myNick, text, msgId };
      addChatMsg(myId, myNick, text, true); seenMessages.add(msgId); flood(payload);
      msgInput.value = ''; msgInput.style.height = 'auto';
    }

    // ========== EMOJI ==========
    EMOJIS.forEach(e => {
      const span = document.createElement('span'); span.textContent = e;
      span.onclick = () => { msgInput.value += e; msgInput.focus(); emojiPicker.classList.remove('show'); };
      emojiPicker.appendChild(span);
    });
    emojiBtn.onclick = () => emojiPicker.classList.toggle('show');

    // ========== FILE SHARING ==========
    fileBtn.onclick = () => {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*,.pdf,.txt,.doc,.docx,.zip,application/*';
      input.onchange = e => { Array.from(e.target.files).forEach(sendFile); };
      input.click();
    };

    async function sendFile(file) {
      if (connections.size === 0 && !isHost) return showToast('No one connected');
      const transferId = Date.now() + '-' + Math.random().toString(36).slice(2);
      const chunkSize = 16 * 1024;
      const totalChunks = Math.ceil(file.size / chunkSize);
      let preview = null;
      if (file.type.startsWith('image/')) {
        preview = await new Promise(res => {
          const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(file);
        });
      }
      const info = { type: 'file-info', transferId, name: file.name, size: file.size, fileType: file.type, totalChunks, preview, from: myId, nick: myNick };
      flood(info);
      // show locally
      const extra = preview
        ? `<div class="msg-file"><img src="${preview}" alt=""><div>${escapeHtml(file.name)}<br><small>${formatSize(file.size)}</small></div></div>`
        : `<div class="msg-file"><i class="fas fa-file"></i><div>${escapeHtml(file.name)}<br><small>${formatSize(file.size)}</small></div></div>`;
      addChatMsg(myId, myNick, file.name, true, extra);

      const reader = new FileReader();
      reader.onload = e => {
        const bytes = new Uint8Array(e.target.result);
        let i = 0;
        function next() {
          if (i >= totalChunks) return;
          const start = i * chunkSize, end = Math.min(start + chunkSize, file.size);
          const chunk = bytes.slice(start, end);
          let bin = ''; chunk.forEach(b => bin += String.fromCharCode(b));
          flood({ type: 'file-chunk', transferId, index: i, data: btoa(bin), total: totalChunks });
          i++; if (i < totalChunks) setTimeout(next, 8);
        }
        next();
      };
      reader.readAsArrayBuffer(file);
    }

    function handleFileInfo(fromId, info) {
      fileTransfers.set(info.transferId, { ...info, chunks: new Array(info.totalChunks), received: 0, peerId: fromId });
      const extra = info.preview
        ? `<div class="msg-file" onclick="downloadTransfer('${info.transferId}')"><img src="${info.preview}" alt=""><div>${escapeHtml(info.name)}<br><small>${formatSize(info.size)}</small></div></div>`
        : `<div class="msg-file" onclick="downloadTransfer('${info.transferId}')"><i class="fas fa-file"></i><div>${escapeHtml(info.name)}<br><small>${formatSize(info.size)}</small></div></div>`;
      addChatMsg(fromId, info.nick, info.name, false, extra);
    }

    function handleFileChunk(fromId, chunk) {
      const t = fileTransfers.get(chunk.transferId); if (!t) return;
      try {
        const bin = atob(chunk.data);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        t.chunks[chunk.index] = bytes; t.received++;
        if (t.received === t.totalChunks) {
          let len = 0; t.chunks.forEach(c => len += c.length);
          const combined = new Uint8Array(len); let off = 0;
          t.chunks.forEach(c => { combined.set(c, off); off += c.length; });
          t.blobUrl = URL.createObjectURL(new Blob([combined], { type: t.fileType }));
          showToast('File ready: ' + t.name);
        }
      } catch(e){}
    }

    window.downloadTransfer = function(id) {
      const t = fileTransfers.get(id);
      if (t && t.blobUrl) {
        const a = document.createElement('a'); a.href = t.blobUrl; a.download = t.name; a.click();
      } else showToast('File not ready yet');
    };

    function formatSize(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
      return (b/1048576).toFixed(1) + ' MB';
    }

    // ========== MEDIA (CAM / MIC / SCREEN) ==========
    async function enableCamMic(video = true, audio = true) {
      try {
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
        }
        localStream = await navigator.mediaDevices.getUserMedia({
          video: video ? { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' } : false,
          audio: audio
        });
        camEnabled = video; micEnabled = audio;
        camBtn.classList.toggle('active', camEnabled);
        micBtn.classList.toggle('active', micEnabled);
        showLocalVideo();
        videoSection.classList.add('active');
        mediaBar.classList.add('active');
        // call all current peers
        online.forEach((_, id) => { if (id !== myId) callPeer(id); });
        showToast(video ? 'Camera on' : 'Microphone on');
      } catch (e) {
        showToast('Could not access camera/microphone');
        console.error(e);
      }
    }

    function callPeer(peerId) {
      if (!localStream || mediaCalls.has(peerId)) return;
      try {
        const call = peer.call(peerId, localStream, { metadata: { nick: myNick, screen: false } });
        mediaCalls.set(peerId, call);
        call.on('stream', stream => showRemoteVideo(peerId, stream));
        call.on('close', () => cleanupMediaFor(peerId));
        call.on('error', () => cleanupMediaFor(peerId));
      } catch(e){}
    }

    function handleIncomingCall(call) {
      const isScreen = call.metadata && call.metadata.screen;
      // Answer with our local stream if we have one, otherwise null
      call.answer(localStream || undefined);
      mediaCalls.set(call.peer, call);
      call.on('stream', stream => {
        if (isScreen) showScreenShare(call.peer, stream);
        else showRemoteVideo(call.peer, stream);
      });
      call.on('close', () => cleanupMediaFor(call.peer));
    }

    function showLocalVideo() {
      let tile = document.getElementById('tile-local');
      if (!tile) {
        tile = document.createElement('div');
        tile.className = 'video-tile'; tile.id = 'tile-local';
        tile.innerHTML = `<video muted autoplay playsinline></video><div class="label">You</div>`;
        videoGrid.prepend(tile);
      }
      tile.querySelector('video').srcObject = localStream;
    }

    function showRemoteVideo(peerId, stream) {
      remoteStreams.set(peerId, stream);
      let tile = document.getElementById('tile-' + peerId);
      if (!tile) {
        tile = document.createElement('div');
        tile.className = 'video-tile'; tile.id = 'tile-' + peerId;
        const nick = online.get(peerId) || peerId.substring(0,6);
        tile.innerHTML = `<video autoplay playsinline></video><div class="label">${escapeHtml(nick)}</div>`;
        videoGrid.appendChild(tile);
      }
      tile.querySelector('video').srcObject = stream;
      videoSection.classList.add('active');
    }

    function showScreenShare(peerId, stream) {
      let tile = document.getElementById('tile-screen');
      if (!tile) {
        tile = document.createElement('div');
        tile.className = 'video-tile screen-share'; tile.id = 'tile-screen';
        tile.innerHTML = `<video autoplay playsinline></video><div class="label">🖥️ Host screen</div>`;
        videoGrid.prepend(tile);
      }
      tile.querySelector('video').srcObject = stream;
      videoSection.classList.add('active');
    }

    function cleanupMediaFor(peerId) {
      const call = mediaCalls.get(peerId);
      if (call) { try { call.close(); } catch(e){} mediaCalls.delete(peerId); }
      remoteStreams.delete(peerId);
      const tile = document.getElementById('tile-' + peerId);
      if (tile) tile.remove();
      if (videoGrid.children.length === 0) {
        videoSection.classList.remove('active');
        mediaBar.classList.remove('active');
      }
    }

    function stopAllMedia() {
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
      mediaCalls.forEach(c => { try { c.close(); } catch(e){} });
      mediaCalls.clear(); remoteStreams.clear();
      videoGrid.innerHTML = '';
      videoSection.classList.remove('active'); mediaBar.classList.remove('active');
      camEnabled = micEnabled = screenSharing = false;
      camBtn.classList.remove('active'); micBtn.classList.remove('active'); screenBtn.classList.remove('active');
    }

    camBtn.onclick = () => {
      if (camEnabled) {
        // turn off camera track
        if (localStream) localStream.getVideoTracks().forEach(t => { t.enabled = false; t.stop(); });
        camEnabled = false; camBtn.classList.remove('active');
        const localTile = document.getElementById('tile-local');
        if (localTile) localTile.remove();
      } else {
        enableCamMic(true, micEnabled || true);
      }
    };

    micBtn.onclick = () => {
      if (!localStream) {
        enableCamMic(false, true);
        return;
      }
      const track = localStream.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        micEnabled = track.enabled;
        micBtn.classList.toggle('active', micEnabled);
        showToast(micEnabled ? 'Mic on' : 'Mic muted');
      }
    };

    // Host screen share
    screenBtn.onclick = async () => {
      if (!isHost) return showToast('Only host can share screen');
      if (screenSharing) {
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        screenStream = null; screenSharing = false;
        screenBtn.classList.remove('active');
        const st = document.getElementById('tile-screen'); if (st) st.remove();
        // re-call with normal stream if any
        if (localStream) online.forEach((_, id) => { if (id !== myId) callPeer(id); });
        showToast('Screen share stopped');
        return;
      }
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        screenSharing = true; screenBtn.classList.add('active');
        showScreenShare(myId, screenStream);
        // Call everyone with screen stream
        online.forEach((_, id) => {
          if (id === myId) return;
          try {
            const call = peer.call(id, screenStream, { metadata: { nick: myNick, screen: true } });
            mediaCalls.set(id + '-screen', call);
          } catch(e){}
        });
        screenStream.getVideoTracks()[0].onended = () => screenBtn.onclick();
        showToast('Sharing screen');
      } catch(e) { showToast('Screen share cancelled'); }
    };

    $('toggleMicMedia').onclick = () => micBtn.onclick();
    $('toggleCamMedia').onclick = () => camBtn.onclick();
    $('toggleScreenMedia').onclick = () => screenBtn.onclick();
    $('stopMediaBtn').onclick = stopAllMedia;

    // ========== PRIVATE CHAT ==========
    function requestPrivate(peerId, nick) {
      if (privateWith) return showToast('Already in a private chat');
      const conn = connections.get(peerId);
      if (!conn || !conn.open) return showToast('User not connected');
      try {
        conn.send(JSON.stringify({ type: 'private-request', nick: myNick }));
        showToast(`Private request sent to ${nick}`);
      } catch(e){}
    }

    $('acceptPrivate').onclick = () => {
      if (!pendingPrivateFrom) return;
      const conn = connections.get(pendingPrivateFrom);
      if (conn && conn.open) {
        try { conn.send(JSON.stringify({ type: 'private-accept', nick: myNick })); } catch(e){}
      }
      privateWith = pendingPrivateFrom;
      openPrivateModal(online.get(pendingPrivateFrom) || 'User');
      $('privateRequest').classList.remove('active');
      pendingPrivateFrom = null;
    };

    $('declinePrivate').onclick = () => {
      if (pendingPrivateFrom) {
        const conn = connections.get(pendingPrivateFrom);
        if (conn && conn.open) try { conn.send(JSON.stringify({ type: 'private-decline' })); } catch(e){}
      }
      $('privateRequest').classList.remove('active');
      pendingPrivateFrom = null;
    };

    function openPrivateModal(nick) {
      $('privateTitle').textContent = 'Private chat with ' + nick;
      $('privateModal').classList.add('active');
      $('modalBackdrop').classList.add('active');
      renderPrivateMessages();
    }

    function renderPrivateMessages() {
      const box = $('privateMessages');
      box.innerHTML = '';
      const list = privateMessages.get(privateWith) || [];
      list.forEach(m => {
        const mine = m.from === myId;
        const div = document.createElement('div');
        div.style.cssText = `margin:6px 0;text-align:${mine ? 'right' : 'left'}`;
        div.innerHTML = `<span style="background:${mine ? 'var(--message-outgoing)' : 'var(--message-incoming)'};padding:8px 12px;border-radius:14px;display:inline-block;max-width:80%;font-size:14px">${escapeHtml(m.text)}</span>`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    $('privateSend').onclick = () => {
      const text = $('privateInput').value.trim(); if (!text || !privateWith) return;
      if (!privateMessages.has(privateWith)) privateMessages.set(privateWith, []);
      privateMessages.get(privateWith).push({ from: myId, nick: myNick, text, time: Date.now() });
      renderPrivateMessages();
      const conn = connections.get(privateWith);
      if (conn && conn.open) {
        try { conn.send(JSON.stringify({ type: 'private-chat', nick: myNick, text })); } catch(e){}
      }
      $('privateInput').value = '';
    };
    $('privateInput').addEventListener('keypress', e => { if (e.key === 'Enter') $('privateSend').onclick(); });

    $('closePrivate').onclick = () => {
      $('privateModal').classList.remove('active');
      $('modalBackdrop').classList.remove('active');
      privateWith = null;
    };
    $('modalBackdrop').onclick = () => $('closePrivate').onclick();

    // ========== EVENTS ==========
    joinBtn.addEventListener('click', start);
    nickInput.addEventListener('keypress', e => { if (e.key === 'Enter') start(); });
    roomInput.addEventListener('keypress', e => { if (e.key === 'Enter') start(); });
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    msgInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 90) + 'px'; });
    menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
    document.addEventListener('click', e => {
      if (window.innerWidth <= 900 && sidebar.classList.contains('open') && !sidebar.contains(e.target) && e.target !== menuBtn)
        sidebar.classList.remove('open');
      if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) emojiPicker.classList.remove('show');
    });

    nickInput.focus();
  </script>
