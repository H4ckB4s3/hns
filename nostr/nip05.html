
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handshake Nostr Resolver</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 35px 18px;
  background: #101116;
  color: #eee;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 { color: #a78bfa; }

input, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 7px;
  font-size: 15px;
}

input {
  background: #20212a;
  border: 1px solid #444;
  color: white;
}

button {
  background: #7950dc;
  border: 0;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:disabled { opacity: .5; }

.step {
  background: #1b1c24;
  padding: 12px;
  border-radius: 6px;
  margin: 8px 0;
  overflow-wrap: anywhere;
}

.success { color: #62df91; }
.error { color: #ff7777; }

pre {
  background: #1b1c24;
  border: 1px solid #333;
  padding: 16px;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #b9e9c4;
  min-height: 70px;
}

small { color: #888; }
</style>
</head>

<body>
<div class="container">

<h1>Handshake Nostr Resolver</h1>
<p>Resolve Handshake domains and retrieve NIP-05 identities.</p>

<input id="domain" value="hnsbroker"
       placeholder="Handshake domain">

<button id="resolveBtn">Resolve Nostr Identity</button>

<p id="status">Ready.</p>

<div id="steps"></div>

<h3>Nostr JSON response</h3>
<pre id="result">Waiting...</pre>

</div>

<!-- Corsfix browser SDK -->
<script src="https://unpkg.com/corsfix"></script>

<script>
const DOH = "https://api.web3dns.net/";

const $ = id => document.getElementById(id);

function log(message, type = "") {
  const div = document.createElement("div");
  div.className = "step " + type;
  div.textContent = message;
  $("steps").appendChild(div);
}

function validPublicIPv4(ip) {
  const p = ip.split(".").map(Number);

  if (p.length !== 4 || p.some(n =>
      !Number.isInteger(n) || n < 0 || n > 255)) {
    return false;
  }

  const [a,b] = p;

  return !(
    a === 0 || a === 10 || a === 127 ||
    a >= 224 ||
    (a === 100 && b >= 64 && b <= 127) ||
    (a === 169 && b === 254) ||
    (a === 172 && b >= 16 && b <= 31) ||
    (a === 192 && b === 168) ||
    (a === 192 && b === 0) ||
    (a === 198 && (b === 18 || b === 19))
  );
}

async function proxyFetch(url, headers = {}) {
  if (!window.corsfix?.fetch) {
    throw new Error("Corsfix SDK did not load.");
  }

  return corsfix.fetch(url, {
    method: "GET",
    credentials: "omit",
    corsfix: {
      headers: headers
    }
  });
}

async function resolveDomain() {
  const domain = $("domain").value
    .trim()
    .toLowerCase()
    .replace(/\.$/, "");

  $("steps").innerHTML = "";
  $("result").textContent = "";
  $("status").textContent = "Starting...";
  $("resolveBtn").disabled = true;

  try {
    // Validate input
    if (!/^(?=.{1,253}$)[a-z0-9-]+(\.[a-z0-9-]+)*$/.test(domain)) {
      throw new Error("Invalid Handshake domain.");
    }

    // STEP 1: DNS over HTTPS
    $("status").textContent = "Resolving Handshake DNS...";

    const dohUrl = DOH + "?name=" + encodeURIComponent(domain);

    const dnsResponse = await proxyFetch(dohUrl);

    if (!dnsResponse.ok) {
      throw new Error("DoH error: " + dnsResponse.status);
    }

    const dns = await dnsResponse.json();

    const records = (dns.Answer || []).filter(
      r => r.type === 1 && validPublicIPv4(r.data)
    );

    if (!records.length) {
      throw new Error("No usable public IPv4 record found.");
    }

    const ip = records[0].data;

    log("DNS resolved: " + domain + " → " + ip, "success");

    // STEP 2: HTTP request through Corsfix
    $("status").textContent = "Fetching Nostr identity...";

    const target =
      "http://" + ip + "/.well-known/nostr.json";

    log("Target: " + target);

    log("Setting upstream Host header: " + domain);

    const response = await proxyFetch(target, {
      "Host": domain,
      "Accept": "application/json"
    });

    if (!response.ok) {
      throw new Error(
        "Nostr endpoint returned HTTP " + response.status
      );
    }

    // STEP 3: Parse Nostr JSON
    const data = await response.json();

    if (!data.names || typeof data.names !== "object") {
      throw new Error("Invalid NIP-05 JSON: missing names object.");
    }

    $("result").textContent =
      JSON.stringify(data, null, 2);

    $("status").textContent = "Nostr identity retrieved!";

    log("Nostr JSON successfully retrieved!", "success");

    // Show identities
    for (const [name, pubkey] of Object.entries(data.names)) {
      log(name + " → " + pubkey, "success");
    }

  } catch (error) {
    $("status").textContent = "Resolution failed.";

    $("result").textContent =
      error.name + ": " + error.message;

    log(error.message, "error");

    console.error(error);

  } finally {
    $("resolveBtn").disabled = false;
  }
}

$("resolveBtn").addEventListener("click", resolveDomain);

$("domain").addEventListener("keydown", e => {
  if (e.key === "Enter") resolveDomain();
});
</script>

</body>
</html>
