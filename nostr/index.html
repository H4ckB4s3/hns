<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d9bf0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Cosa Nostr</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/img/fav.png" type="image/png">
  <link rel="icon" href="/img/fav.ico">
  <script src="/qr-generator.js"></script>
  <script src="/qr-scanner.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo" id="logo">
        <span class="logo-text">COSA NOSTR</span>
        <img class="logo-icon" src="img/nostr.png" alt="Cosa Nostr" onerror="this.style.display='none'">
      </div>
      <nav id="nav">
        <a class="nav-item active" data-view="home">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.1L1 12h3v9h6v-6h4v6h6v-9h3L12 2.1z"/></svg>
          <span class="nav-label">Home</span>
        </a>
        <a class="nav-item" data-view="explore">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
          <span class="nav-label">Explore</span>
        </a>
        <a class="nav-item" data-view="notifications">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          <span class="nav-label">Notifications</span>
        </a>
        <a class="nav-item" data-view="following">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          <span class="nav-label">Following</span>
        </a>
        <a class="nav-item" data-view="bookmarks">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
          <span class="nav-label">Bookmarks</span>
        </a>
        <a class="nav-item" data-view="profile">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span class="nav-label">Profile</span>
        </a>
        <a class="nav-item" data-view="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          <span class="nav-label">Settings</span>
        </a>
        <div id="authNav"></div>
      </nav>
    </aside>

    <main class="main">
      <div class="header">
        <div class="search-bar">
          <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="npub, name@domain, or domain">
            <button class="search-go" id="searchGoBtn" title="Go" aria-label="Search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M13 6l6 6-6 6"></path>
              </svg>
            </button>
          </div>
          <button class="search-scan" id="searchScanBtn" title="Scan QR" aria-label="Scan QR">
            <img src="img/qr.png" alt="" onerror="this.outerHTML='&#9634;'">
          </button>
        </div>
      </div>
      <div id="content">
        <div class="loader">Loading Cosa Nostr...</div>
      </div>
    </main>

    <aside class="right-sidebar">
      <div class="card">
        <h3>What's happening</h3>
        <div id="rightFollowingFeed" class="right-following-feed">
          <p style="color:var(--text-secondary); font-size:0.9rem;">Follow some accounts to see their latest notes here.</p>
        </div>
      </div>
      <div class="card card-link" id="relaysCard">
        <h3>Relays</h3>
        <div id="relayStatus" style="font-size:0.85rem; color:var(--text-secondary);">Connecting...</div>
      </div>
    </aside>
  </div>

  <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>

  <div class="modal" id="loginModal">
    <div class="modal-content" style="max-width:380px; text-align:center; padding:32px 24px; position:relative;">
      <button class="modal-close" id="closeLogin" title="Close" aria-label="Close">✕</button>
      <div style="font-size:1.5rem; font-weight:600; margin-bottom:16px;">Cosa Nostr</div>
    </div>
  </div>

  <div class="modal" id="qrModal">
    <div class="modal-content qr-modal-content">
      <button class="qr-back-arrow" id="closeQr" title="Close">←</button>
      <div class="qr-profile-info" id="qrProfileInfo">
        <div class="profile-avatar-large" id="qrAvatar">⚡</div>
        <div id="qrName" class="qr-profile-name">Loading...</div>
      </div>
      <div class="qr-primary-options" id="qrPrimaryOptions"></div>
      <div class="qr-canvas" id="qrCanvas"></div>
      <div class="qr-social-row" id="qrSocials"></div>
      <div class="qr-wallet-row" id="qrWallets"></div>
      <div class="qr-value-display" id="qrValue">—</div>
    </div>
  </div>

  <div class="modal" id="scannerModal">
    <div class="modal-content" style="max-width:420px; padding:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <strong>Scan QR</strong>
        <button class="secondary" id="closeScanner" style="padding:6px 12px;">✕</button>
      </div>
      <video id="scannerVideo" style="width:100%; border-radius:12px; background:#000;" playsinline muted></video>
      <p id="scannerStatus" style="color:var(--text-secondary); font-size:0.85rem; margin-top:8px; text-align:center;">Starting camera…</p>
    </div>
  </div>

  <script src="/crypto.js"></script>
  <script src="/spam.js"></script>
  <script src="/app.js"></script>
</body>
</html>
